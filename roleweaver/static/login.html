<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Role Weaver</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#10151b;color:#e9edf1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,560px);background:#19222c;border:1px solid #405166;border-radius:14px;overflow:hidden}img{display:block;width:100%;height:auto}.content{padding:28px}h1{margin:0 0 8px;font-size:25px}p{color:#bdc9d6}label{display:block;margin-top:24px}input,button{font:inherit;border-radius:6px;padding:12px;border:1px solid #72899b}input{width:100%;margin:8px 0 18px;background:#10151b;color:#fff}button{background:#376b63;color:#fff;cursor:pointer;width:100%}button:disabled{opacity:.5;cursor:wait}input:focus-visible,button:focus-visible{outline:2px solid #a9dfcf;outline-offset:3px}#login-error{color:#ffb8a7;min-height:1.5em;margin-bottom:0}small{color:#a9b5c1}
</style></head><body><main><img src="/login-image.png" alt="Role Weaver Server Addon" width="1880" height="836"><div class="content"><h1>Dashboard sign in</h1><p>Enter the password set by your server administrator.</p><form id="login-form"><label for="password">Dashboard password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus><button id="login-submit" type="submit">Sign in</button><p id="login-error" role="alert"></p></form><p><small>Forgot the password? It can be reset from the server terminal.</small></p></div></main><script src="/login.js"></script></body></html>
